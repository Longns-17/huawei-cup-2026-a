[project]
name = "huawei-a-independent"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
description = "Independent FINAL IDEA implementation for official multicore NPU scheduling"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
